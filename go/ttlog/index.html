(function () {
  var a = window.APPS["ttlog"], p = window.devicePlatform();
  var s = p === "ios" || p === "android" ? a[p] : null;
  var q = location.search;
  location.replace(s && s.live ? window.storeUrl(p, s.url) : "../../links/" + q + "#ttlog");
})();
</script>
