<!doctype html>
<html lang="ko" data-lang="ko" data-title-ko="뛰뛰랩스 앱 받기" data-title-en="Get TT Labs apps">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뛰뛰랩스 앱 받기</title>
<meta name="description" content="PaceGraphy · KokCut — App Store, Google Play에서 받기">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="뛰뛰랩스 앱 받기">
<meta property="og:description" content="PaceGraphy · KokCut — App Store, Google Play">
<meta property="og:url" content="https://inwoox.github.io/mindeulle/links/">
<meta property="og:image" content="https://inwoox.github.io/mindeulle/img/pacegraphy.png">
<link rel="icon" href="../img/pacegraphy.png">
<link rel="stylesheet" href="../style.css">
<script src="../lang.js"></script>
<script src="../apps.js"></script>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../"><i></i><span class="ko">뛰뛰랩스</span><span class="en">TT Labs</span></a>
  <nav>
    <a class="hide-sm" href="../support/"><span class="ko">도움말</span><span class="en">Help</span></a>
    <button class="lang-btn" type="button"><span class="ko">English</span><span class="en">한국어</span></button>
  </nav>
</div></header>

<main class="wrap links-page">
  <div class="ko">
    <h1>앱 받기</h1>
    <p class="lead">쓰는 폰에 맞는 스토어를 눌러 주세요.</p>
  </div>
  <div class="en">
    <h1>Get the apps</h1>
    <p class="lead">Tap the store for your phone.</p>
  </div>

  <div class="store-list" id="list"></div>
  <noscript>
    <p><a href="https://apps.apple.com/app/id6762495276">PaceGraphy — App Store</a><br>
    <a href="https://play.google.com/store/apps/details?id=com.inwoo.pacegraphy">PaceGraphy — Google Play</a></p>
  </noscript>

  <div class="links">
    <a href="../support/"><span class="ko">도움말</span><span class="en">Help</span></a>
    <a href="../privacy/"><span class="ko">개인정보 처리방침</span><span class="en">Privacy Policy</span></a>
  </div>
</main>
<footer><div class="wrap">
  <span class="ko">문의</span><span class="en">Contact</span> · <a href="mailto:inwoox@gmail.com">inwoox@gmail.com</a><br>
  <span class="ko">뛰뛰랩스는 민들레스튜디오의 앱 브랜드예요.</span><span class="en">TT Labs is the app brand of Mindeulle Studio.</span>
</div></footer>

<script>
(function () {
  var ICON = {
    ios: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>',
    android: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.2 2.6c-.2.2-.3.6-.3 1v16.8c0 .4.1.8.3 1l9.3-9.4-9.3-9.4zm10.4 10.5 2.6 2.6-11.1 6.3 8.5-8.9zm3.6-3.6 2.7 1.5c.8.5.8 1.4 0 1.9l-2.7 1.5-2.9-2.5 2.9-2.4zM6.1 2 17.2 8.3l-2.6 2.6L6.1 2z"/></svg>'
  };
  var LABEL = { ios: "App Store", android: "Google Play" };
  var me = window.devicePlatform();
  var order = me === "android" ? ["android", "ios"] : ["ios", "android"];

  var TEXT = {
    ios: ['App Store에서 받기', 'Download on the App Store'],
    android: ['Google Play에서 받기', 'Get it on Google Play']
  };
  function button(store, info) {
    var mine = me === store || me === "other";
    if (!info.live) {
      return '<span class="store-btn soon">' + ICON[store] + '<span class="t">' + LABEL[store] +
        ' · <span class="ko">곧 출시</span><span class="en">Coming soon</span></span></span>';
    }
    return '<a class="store-btn' + (mine ? ' mine' : '') + '" href="' + window.storeUrl(store, info.url) +
      '" target="_blank" rel="noopener">' + ICON[store] + '<span class="t"><span class="ko">' + TEXT[store][0] +
      '</span><span class="en">' + TEXT[store][1] + '</span></span></a>';
  }

  var html = "";
  Object.keys(window.APPS).forEach(function (id) {
    var a = window.APPS[id];
    var extra = "";
    if (!a.android.live && a.android.test) {
      extra = '<a class="test-link" href="../' + a.android.test + '"><span class="ko">안드로이드 테스트에 먼저 참여하기 →</span>' +
        '<span class="en">Join the Android test first →</span></a>';
    }
    html += '<section class="store-card" id="' + id + '">' +
      '<div class="app-head"><img src="../' + a.icon + '" alt="" width="60" height="60"><div><b>' + a.name +
      ' <span class="ko inline">' + a.nameKo + '</span></b><span class="ko">' + a.ko + '</span><span class="en">' + a.en + '</span></div></div>' +
      '<div class="store-row">' + order.map(function (s) { return button(s, a[s]); }).join("") + '</div>' + extra + '</section>';
  });
  document.getElementById("list").innerHTML = html;
})();
</script>
</body>
</html>
